<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

            color: #e0e0e0;
            padding: 1.5rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.5rem;

            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;

            background: #16172a;
            border: 1px solid #ffffff08;
            border-radius: 10px;
            padding: 1.25rem;
            overflow: hidden;
        }

        .chart-card h2 {
            font-size: 0.8rem;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }
        .latest-values {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .sensor-card {
            background: #16172a;
            border: 1px solid #ffffff08;
            border-radius: 10px;
            padding: 1rem 1.25rem;
        }
        .sensor-card .name {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.4rem;
        }
        .sensor-card .temp {
            font-size: 1.8rem;
            font-weight: 300;
        }
        .sensor-card .details {
            font-size: 0.8rem;
            color: #999;
            margin-top: 0.25rem;
        }
        .date-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .date-range label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .date-range input[type="datetime-local"] {
            background: #16172a;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            font-family: inherit;
        }
        .date-range input[type="datetime-local"]:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .date-range .sep { color: #555; font-size: 0.8rem; }
        .date-range button {
            background: #ffffff10;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #999;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }
        .date-range button:hover { background: #ffffff18; color: #ccc; }
        .no-data {
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.2rem; }
            .header { margin-bottom: 1rem; }
            .charts {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            .chart-card.wide { grid-column: auto; }
            .chart-card { padding: 1rem; }
            .chart-card h2 { font-size: 0.7rem; }
            .latest-values { gap: 0.5rem; margin-bottom: 1rem; }
            .sensor-card { padding: 0.75rem 1rem; }
            .sensor-card .temp { font-size: 1.5rem; }
            .sensor-card .details { font-size: 0.7rem; }
            .header { flex-direction: column; gap: 0.2rem; }
            .status { font-size: 0.7rem; }
            .date-range { gap: 0.4rem; }
            .date-range input[type="datetime-local"] { font-size: 0.75rem; padding: 0.3rem 0.4rem; }
            .date-range label { font-size: 0.65rem; }
        }

<body>
    <div class="header">
        <h1>Air Quality</h1>
        <span class="status" id="status">Loading&hellip;</span>
    </div>
    <div class="date-range">
        <label for="rangeFrom">From</label>
        <input type="datetime-local" id="rangeFrom">
        <span class="sep">&ndash;</span>
        <label for="rangeTo">To</label>
        <input type="datetime-local" id="rangeTo">
        <button id="rangeReset">Reset</button>
    </div>
    <div class="latest-values" id="latest"></div>
    <div class="charts">
        <div class="chart-card">
            <h2>Temperature (&deg;F)</h2>
            <canvas id="tempChart"></canvas>
        </div>
        <div class="chart-card">
            <h2>Dew Point (&deg;F)</h2>
            <canvas id="dewpointChart"></canvas>
        </div>
        <div class="chart-card">
            <h2>Humidity (%)</h2>
            <canvas id="humidityChart"></canvas>
        </div>
        <div class="chart-card">
            <h2>PM2.5 (&micro;g/m&sup3;)</h2>
            <canvas id="pmChart"></canvas>
        </div>
        <div class="chart-card wide">
            <h2>AC State</h2>
            <canvas id="acStateChart"></canvas>
        </div>
    </div>
</body>
