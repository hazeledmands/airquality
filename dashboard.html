<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 1.5rem;
        }
        h1 { font-size: 1.4rem; font-weight: 600; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.5rem;
        }
        .status { color: #666; font-size: 0.8rem; }
        .charts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .chart-card {
            background: #16172a;
            border: 1px solid #ffffff08;
            border-radius: 10px;
            padding: 1.25rem;
            overflow: hidden;
        }
        .chart-card.wide { grid-column: 1 / -1; }
        .chart-card h2 {
            font-size: 0.8rem;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .drag-handle {
            cursor: grab;
            color: #555;
            font-size: 0.9rem;
            line-height: 1;
            user-select: none;
            touch-action: none;
            flex-shrink: 0;
        }
        .drag-handle:hover { color: #999; }
        .drag-handle:active { cursor: grabbing; }
        .chart-card.dragging {
            opacity: 0.35;
        }
        .chart-card[draggable="true"] {
            transition: opacity 0.15s ease;
        }
        .latest-values {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .sensor-card {
            background: #16172a;
            border: 1px solid #ffffff08;
            border-radius: 10px;
            padding: 1rem 1.25rem;
        }
        .sensor-card .name {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.4rem;
        }
        .sensor-card .temp {
            font-size: 1.8rem;
            font-weight: 300;
        }
        .sensor-card .details {
            font-size: 0.8rem;
            color: #999;
            margin-top: 0.25rem;
        }
        .date-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .date-range label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .date-range input[type="datetime-local"] {
            background: #16172a;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            font-family: inherit;
        }
        .date-range input[type="datetime-local"]:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .date-range .sep { color: #555; font-size: 0.8rem; }
        .date-range button {
            background: #ffffff10;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #999;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }
        .date-range button:hover { background: #ffffff18; color: #ccc; }
        .date-range button.active { background: #38bdf820; border-color: #38bdf8; color: #38bdf8; }
        .toggle-label {
            font-size: 0.75rem;
            color: #888;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .toggle-label input { cursor: pointer; }
        .no-data {
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.2rem; }
            .header { margin-bottom: 1rem; }
            .charts {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            .chart-card.wide { grid-column: auto; }
            .chart-card { padding: 1rem; }
            .chart-card h2 { font-size: 0.7rem; }
            .latest-values { gap: 0.5rem; margin-bottom: 1rem; }
            .sensor-card { padding: 0.75rem 1rem; }
            .sensor-card .temp { font-size: 1.5rem; }
            .sensor-card .details { font-size: 0.7rem; }
            .header { flex-direction: column; gap: 0.2rem; }
            .status { font-size: 0.7rem; }
            .date-range { gap: 0.4rem; }
            .date-range input[type="datetime-local"] { font-size: 0.75rem; padding: 0.3rem 0.4rem; }
            .date-range label { font-size: 0.65rem; }
        }
    </style>

<body>
    <div class="header">
        <h1>Air Quality</h1>
        <span class="status" id="status">Loading&hellip;</span>
    </div>
    <nav><a href="/" style="color:#38bdf8;font-size:0.8rem;text-decoration:none">&larr; View by room</a></nav>
    <div class="date-range">
        <button id="rangePrev" title="Previous">&#9664;</button>
        <button class="preset-btn" data-ms="3600000">1h</button>
        <button class="preset-btn" data-ms="28800000">8h</button>
        <button class="preset-btn" data-ms="86400000">1d</button>
        <button class="preset-btn" data-ms="259200000">3d</button>
        <button class="preset-btn" data-ms="604800000">1w</button>
        <button id="rangeNext" title="Next">&#9654;</button>
        <label for="rangeFrom">From</label>
        <input type="datetime-local" id="rangeFrom">
        <span class="sep">&ndash;</span>
        <label for="rangeTo">To</label>
        <input type="datetime-local" id="rangeTo">
        <button id="rangeReset">Reset</button>
        <label class="toggle-label"><input type="checkbox" id="showPeaks" checked> Peaks</label>
    </div>
    <div class="latest-values" id="latest"></div>
    <div class="charts">
        <div class="chart-card" data-chart-id="temp">
            <h2><span class="drag-handle" title="Drag to reorder">&#x2630;</span>Temperature (&deg;F)</h2>
            <canvas id="tempChart"></canvas>
        </div>
        <div class="chart-card" data-chart-id="dewpoint">
            <h2><span class="drag-handle" title="Drag to reorder">&#x2630;</span>Dew Point (&deg;F)</h2>
            <canvas id="dewpointChart"></canvas>
        </div>
        <div class="chart-card" data-chart-id="humidity">
            <h2><span class="drag-handle" title="Drag to reorder">&#x2630;</span>Humidity (%)</h2>
            <canvas id="humidityChart"></canvas>
        </div>
        <div class="chart-card" data-chart-id="pm">
            <h2><span class="drag-handle" title="Drag to reorder">&#x2630;</span>PM2.5 (&micro;g/m&sup3;)</h2>
            <canvas id="pmChart"></canvas>
        </div>
        <div class="chart-card" data-chart-id="acState">
            <h2><span class="drag-handle" title="Drag to reorder">&#x2630;</span>AC State</h2>
            <canvas id="acStateChart"></canvas>
        </div>
    </div>
</body>
</html>
