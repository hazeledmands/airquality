<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality — By Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 1.5rem;
            padding-top: 0;
        }
        /* Below the header, not in it: in the bar it overflowed on phones. */
        .status-line { display: flex; justify-content: flex-end; margin: 0.25rem 0 0.75rem; min-height: 1rem; }
        .status { color: #8f8fa3; font-size: 0.75rem; }
        /* Sticky, not fixed: the page flows below it whatever its height,
           so nothing hides underneath when it wraps. */
        .date-range {
            position: sticky;
            top: 0;
            margin: 0 -1.5rem;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.5rem;
            background: #0f0f1a;
            border-bottom: 1px solid #ffffff0a;
            flex-wrap: wrap;
        }
        .date-range button {
            background: #ffffff10;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #999;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }
        .date-range button:hover { background: #ffffff18; color: #ccc; }
        .date-range button:disabled { opacity: 0.25; cursor: default; pointer-events: none; }

        /* Time range picker */
        .trp-wrap { position: relative; display: flex; align-items: center; gap: 0.25rem; }
        #trp-trigger {
            background: #16172a;
            border: 1px solid #ffffff20;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        #trp-trigger:hover { border-color: #38bdf840; color: #fff; }
        #trp-popover {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 200;
            background: #16172a;
            border: 1px solid #ffffff18;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,.5);
            display: flex;
            min-width: 480px;
        }
        #trp-quick {
            padding: 0.5rem;
            border-right: 1px solid #ffffff10;
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 160px;
        }
        #trp-quick button {
            background: transparent;
            border: none;
            border-radius: 4px;
            color: #aaa;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        #trp-quick button:hover { background: #ffffff10; color: #e0e0e0; }
        .trp-custom {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex: 1;
        }
        .trp-field { display: flex; flex-direction: column; gap: 0.25rem; }
        .trp-field label { font-size: 0.7rem; color: #8f8fa3; text-transform: uppercase; letter-spacing: 0.05em; }
        .trp-field input {
            background: #0e0e1a;
            border: 1px solid #ffffff15;
            border-radius: 5px;
            color: #e0e0e0;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            font-family: 'SF Mono', 'Fira Mono', monospace;
            outline: none;
        }
        .trp-field input:focus { border-color: #38bdf8; }
        .trp-field input::placeholder { color: #7a7a8c; }
        .trp-hint { font-size: 0.7rem; color: #8f8fa3; line-height: 1.4; }
        #trpApply {
            background: #38bdf820;
            border: 1px solid #38bdf840;
            border-radius: 5px;
            color: #38bdf8;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            align-self: flex-start;
        }
        #trpApply:hover { background: #38bdf830; }
        @media (max-width: 600px) {
            #trp-popover { min-width: calc(100vw - 2rem); flex-direction: column; }
            #trp-quick { border-right: none; border-bottom: 1px solid #ffffff10; flex-direction: row; flex-wrap: wrap; }
        }
        .toggle-label {
            font-size: 0.75rem;
            color: #888;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .toggle-label input { cursor: pointer; }
        #signIn { color: rgba(251,191,36,.9); text-decoration: none; white-space: nowrap; }
        /* .toggle-label's display:flex would otherwise override [hidden]. */
        #signIn[hidden] { display: none; }
        .room-section {
            margin-bottom: 2rem;
        }
        .room-section h2 {
            font-size: 1.1rem;
            font-weight: 400;
            font-family: 'Spectral', Georgia, serif;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #ffffff08;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .drag-handle {
            cursor: grab;
            color: #77778a;
            font-size: 0.9rem;
            line-height: 1;
            user-select: none;
            touch-action: none;
            flex-shrink: 0;
        }
        .drag-handle:hover { color: #999; }
        .drag-handle:active { cursor: grabbing; }
        .room-section.dragging { opacity: 0.35; }
        .room-section[draggable="true"] { transition: opacity 0.15s ease; }
        .chart-card {
            padding: 0.75rem 0;
            overflow: hidden;
        }
        .tempest-panel { padding: 0.25rem 0; }
        /* Chart.js sets display:block inline on the canvas, so hide its box. */
        .tempest-panel.collapsed .chart-box,
        .tempest-panel.collapsed .key-row { display: none; }
        .chart-box { position: relative; }
        /* Vertical swipes scroll the page; horizontal moves reach the touch
           readout without a non-passive listener. */
        .chart-box canvas { touch-action: pan-y pinch-zoom; }
        .key-row { display: none; flex-wrap: wrap; gap: 0 0.25rem; }
        .key-btn {
            min-height: 44px;
            padding: 0 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: transparent;
            border: none;
            color: #b4b4c4;
            font: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .key-btn[aria-pressed="false"] { color: #8f8fa3; text-decoration: line-through; }
        .key-swatch { width: 14px; height: 3px; border-radius: 2px; }
        .panel-label .label-short { display: none; }
        .readout {
            position: fixed;
            top: var(--header-h, 44px);
            left: 0;
            right: 0;
            z-index: 90;
            display: flex;
            flex-wrap: wrap;
            gap: 0.15rem 0.9rem;
            padding: 0.4rem 1rem 0.5rem;
            background: #16172aee;
            border-bottom: 1px solid #ffffff18;
            font-size: 0.8rem;
            color: #d0d0dc;
        }
        .readout[hidden] { display: none; }
        .readout-title { flex-basis: 100%; color: #8f8fa3; font-size: 0.75rem; }
        .readout-item { display: inline-flex; align-items: center; gap: 0.3rem; font-variant-numeric: tabular-nums; }
        .readout-item i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
        .readout-add {
            min-height: 44px;
            padding: 0 0.75rem;
            margin-top: 0.25rem;
            background: #fbbf2420;
            border: 1px solid #fbbf2450;
            border-radius: 6px;
            color: #fbbf24;
            font: inherit;
        }
        .strip-more { display: none; }
        .zoom-btn, #moreBtn { display: none; }
        .more-sheet { display: contents; }
        .panel-label {
            font-size: 0.7rem;
            color: #9a9aab;
            font-family: 'Spectral', Georgia, serif;
            font-style: italic;
            margin-bottom: 0.1rem;
        }
        .heatmap-canvas {
            display: block;
            width: 100%;
            border-top: 1px solid #ffffff08;
            margin-bottom: 0.5rem;
        }
        .room-latest {
            display: flex;
            gap: 0.4rem 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            font-family: 'Spectral', Georgia, serif;
            color: #bbb;
        }
        .room-latest .value { color: #e0e0e0; font-weight: 500; font-variant-numeric: tabular-nums; }
        .room-latest .devices { color: #8f8fa3; font-style: italic; }
        .no-data {
            color: #8f8fa3;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        #rooms-container:empty::after {
            content: 'Waiting for first sensor reading\2026';
            display: block;
            color: #8f8fa3;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; padding-top: 0; }
            .date-range { margin: 0 -1rem; }
            .status { font-size: 0.7rem; }
            .room-section h2 { font-size: 1rem; }
            .chart-card { padding: 0.5rem 0; }
            .room-latest { font-size: 0.75rem; gap: 0.25rem 1rem; }
        }
        /* Phones, portrait or landscape: COMPACT_QUERY in layout.js. */
        @media (max-width: 600px), (max-height: 500px) and (pointer: coarse) {
            .date-range { flex-wrap: nowrap; padding: 0 0.5rem; gap: 0.25rem; }
            .trp-wrap { flex: 1; min-width: 0; gap: 0.25rem; }
            .date-range button, #moreBtn {
                min-width: 44px;
                min-height: 44px;
                padding: 0 0.5rem;
                font-size: 0.85rem;
            }
            #trp-trigger { flex: 1; min-width: 0; min-height: 44px; padding: 0 0.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .zoom-btn, #moreBtn { display: inline-flex; align-items: center; justify-content: center; }
            #moreBtn { background: transparent; border: none; color: #c0c0d0; font-size: 1.3rem; border-radius: 6px; }
            .more-sheet {
                display: none;
                position: absolute;
                top: 100%;
                right: 0;
                left: 0;
                flex-direction: column;
                padding: 0.25rem 1rem 0.5rem;
                background: #16172a;
                border-bottom: 1px solid #ffffff18;
                box-shadow: 0 8px 24px rgba(0,0,0,.5);
            }
            .more-sheet.open { display: flex; }
            .more-sheet .toggle-label { min-height: 44px; font-size: 0.95rem; color: #c0c0d0; }
            .more-sheet .toggle-label input { width: 22px; height: 22px; }
            #signIn { min-height: 44px; display: flex; align-items: center; }
            .key-row { display: flex; }
            /* Reordering by drag isn't worth the scroll conflicts on a phone. */
            .drag-handle { display: none; }
            .panel-label .label-full { display: none; }
            .panel-label .label-short { display: inline; }
            .room-latest .secondary { display: none; }
            .room-latest.expanded .secondary { display: inline; }
            .strip-more {
                display: inline-flex;
                align-items: center;
                min-height: 44px;
                min-width: 44px;
                justify-content: center;
                padding: 0 0.5rem;
                margin: -0.6rem 0;
                background: transparent;
                border: none;
                color: #9fb4ff;
                font: inherit;
                cursor: pointer;
            }
            #trp-popover { position: fixed; top: var(--header-h, 44px); left: 0.5rem; right: 0.5rem; min-width: 0; max-height: calc(100vh - var(--header-h, 44px) - 1rem); overflow: auto; }
            #trp-quick { display: grid; grid-template-columns: 1fr 1fr; }
            #trp-quick button { min-height: 44px; }
            /* 16 px stops iOS Safari zooming the page on focus. */
            .trp-field input { font-size: 16px; min-height: 44px; }
            #trpApply { min-height: 44px; }
        }
    </style>
</head>
<body>
    <div class="date-range">
        <div class="trp-wrap">
            <button id="trp-prev" title="Previous period">&#9664;</button>
            <button id="trp-trigger">Last 3 days</button>
            <button id="trp-next" title="Next period">&#9654;</button>
            <button id="zoomOut" class="zoom-btn" title="Zoom out" aria-label="Zoom out">&minus;</button>
            <button id="zoomIn" class="zoom-btn" title="Zoom in" aria-label="Zoom in">+</button>
            <div id="trp-popover" style="display:none">
                <div id="trp-quick"></div>
                <div class="trp-custom">
                    <div class="trp-field">
                        <label for="trpFrom">From</label>
                        <input type="text" id="trpFrom" placeholder="now-12h">
                    </div>
                    <div class="trp-field">
                        <label for="trpTo">To</label>
                        <input type="text" id="trpTo" placeholder="now">
                    </div>
                    <p class="trp-hint">Relative: <code>now-6h</code>, <code>now-7d</code>, <code>now/d</code><br>Absolute: <code>2025-04-01T00:00:00Z</code></p>
                    <button id="trpApply">Apply time range</button>
                </div>
            </div>
        </div>
        <button id="moreBtn" aria-expanded="false" aria-controls="moreSheet" aria-label="More options" title="More options">&#8943;</button>
        <div id="moreSheet" class="more-sheet">
            <label class="toggle-label"><input type="checkbox" id="showPeaks" checked> Peaks</label>
            <label class="toggle-label"><input type="checkbox" id="showHumidity" checked> High humidity</label>
            <label class="toggle-label"><input type="checkbox" id="showOutdoorTemp"> Outdoor temp</label>
            <a class="toggle-label" id="signIn" href="/login" hidden>Sign in to annotate</a>
        </div>
    </div>
    <div id="readout" class="readout" hidden aria-live="polite"></div>
    <div class="status-line"><span class="status" id="status">Loading&hellip;</span></div>
    <div id="rooms-container"></div>
    <script type="module" src="/src/rooms.js"></script>
</body>
</html>
