<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality — By Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 1.5rem;
            padding-top: calc(1.5rem + 44px);
        }
        .status { color: #666; font-size: 0.8rem; white-space: nowrap; }
        .date-range {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.5rem;
            background: #0f0f1a;
            border-bottom: 1px solid #ffffff0a;
            flex-wrap: wrap;
        }
        .date-range button {
            background: #ffffff10;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #999;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }
        .date-range button:hover { background: #ffffff18; color: #ccc; }
        .date-range button:disabled { opacity: 0.25; cursor: default; pointer-events: none; }

        /* Time range picker */
        .trp-wrap { position: relative; display: flex; align-items: center; gap: 0.25rem; }
        #trp-trigger {
            background: #16172a;
            border: 1px solid #ffffff20;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        #trp-trigger:hover { border-color: #38bdf840; color: #fff; }
        #trp-popover {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 200;
            background: #16172a;
            border: 1px solid #ffffff18;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,.5);
            display: flex;
            min-width: 480px;
        }
        #trp-quick {
            padding: 0.5rem;
            border-right: 1px solid #ffffff10;
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 160px;
        }
        #trp-quick button {
            background: transparent;
            border: none;
            border-radius: 4px;
            color: #aaa;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        #trp-quick button:hover { background: #ffffff10; color: #e0e0e0; }
        .trp-custom {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex: 1;
        }
        .trp-field { display: flex; flex-direction: column; gap: 0.25rem; }
        .trp-field label { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
        .trp-field input {
            background: #0e0e1a;
            border: 1px solid #ffffff15;
            border-radius: 5px;
            color: #e0e0e0;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            font-family: 'SF Mono', 'Fira Mono', monospace;
            outline: none;
        }
        .trp-field input:focus { border-color: #38bdf8; }
        .trp-field input::placeholder { color: #444; }
        .trp-hint { font-size: 0.7rem; color: #555; line-height: 1.4; }
        #trpApply {
            background: #38bdf820;
            border: 1px solid #38bdf840;
            border-radius: 5px;
            color: #38bdf8;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            align-self: flex-start;
        }
        #trpApply:hover { background: #38bdf830; }
        @media (max-width: 600px) {
            #trp-popover { min-width: calc(100vw - 2rem); flex-direction: column; }
            #trp-quick { border-right: none; border-bottom: 1px solid #ffffff10; flex-direction: row; flex-wrap: wrap; }
        }
        .toggle-label {
            font-size: 0.75rem;
            color: #888;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .toggle-label input { cursor: pointer; }
        .room-section {
            margin-bottom: 2rem;
        }
        .room-section h2 {
            font-size: 1.1rem;
            font-weight: 400;
            font-family: 'Spectral', Georgia, serif;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #ffffff08;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .drag-handle {
            cursor: grab;
            color: #555;
            font-size: 0.9rem;
            line-height: 1;
            user-select: none;
            touch-action: none;
            flex-shrink: 0;
        }
        .drag-handle:hover { color: #999; }
        .drag-handle:active { cursor: grabbing; }
        .room-section.dragging { opacity: 0.35; }
        .room-section[draggable="true"] { transition: opacity 0.15s ease; }
        .chart-card {
            padding: 0.75rem 0;
            overflow: hidden;
        }
        .heatmap-canvas {
            display: block;
            width: 100%;
            border-top: 1px solid #ffffff08;
            margin-bottom: 0.5rem;
        }
        .room-latest {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            font-family: 'Spectral', Georgia, serif;
            color: #bbb;
        }
        .room-latest .value { color: #e0e0e0; font-weight: 500; font-variant-numeric: tabular-nums; }
        .no-data {
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        #rooms-container:empty::after {
            content: 'Waiting for first sensor reading\2026';
            display: block;
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; padding-top: calc(1rem + 44px); }
            .date-range { padding: 0.5rem 1rem; gap: 0.4rem; }
            .status { font-size: 0.7rem; }
            .room-section h2 { font-size: 1rem; }
            .chart-card { padding: 0.5rem 0; }
            .room-latest { font-size: 0.75rem; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="date-range">
        <div class="trp-wrap">
            <button id="trp-prev" title="Previous period">&#9664;</button>
            <button id="trp-trigger">Last 3 days</button>
            <button id="trp-next" title="Next period">&#9654;</button>
            <div id="trp-popover" style="display:none">
                <div id="trp-quick"></div>
                <div class="trp-custom">
                    <div class="trp-field">
                        <label for="trpFrom">From</label>
                        <input type="text" id="trpFrom" placeholder="now-12h">
                    </div>
                    <div class="trp-field">
                        <label for="trpTo">To</label>
                        <input type="text" id="trpTo" placeholder="now">
                    </div>
                    <p class="trp-hint">Relative: <code>now-6h</code>, <code>now-7d</code>, <code>now/d</code><br>Absolute: <code>2025-04-01T00:00:00Z</code></p>
                    <button id="trpApply">Apply time range</button>
                </div>
            </div>
        </div>
        <label class="toggle-label"><input type="checkbox" id="showPeaks" checked> Peaks</label>
        <label class="toggle-label"><input type="checkbox" id="showHumidity" checked> High humidity</label>
        <label class="toggle-label"><input type="checkbox" id="showOutdoorTemp"> Outdoor temp</label>
        <span class="status" id="status" style="margin-left: auto;">Loading&hellip;</span>
    </div>
    <div id="rooms-container"></div>
    <script type="module" src="/src/rooms.js"></script>
</body>
</html>
