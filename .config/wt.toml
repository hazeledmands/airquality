# Assign a unique dev container port and start the container
[post-create]
copy = "wt step copy-ignored && direnv allow"
env = '''
if [ -f .docker-env ]; then
    grep -v '^DEV_PORT=\|^COMPOSE_PROJECT_NAME=' .docker-env > .docker-env.tmp && mv .docker-env.tmp .docker-env
fi
echo 'DEV_PORT={{ branch | hash_port }}' >> .docker-env
echo 'COMPOSE_PROJECT_NAME=airquality-{{ branch | sanitize }}' >> .docker-env
'''
container = "bin/dev-container up -d"

# Stop the container when the worktree is removed
[post-remove]
container = "COMPOSE_PROJECT_NAME=airquality-{{ branch | sanitize }} docker compose down 2>/dev/null || true"
