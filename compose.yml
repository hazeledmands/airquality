services:
  dev:
    build: .
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    tmpfs:
      - /tmp:exec
    volumes:
      - .:/app
      - ${HOST_HOME:-.}/.claude:/home/dev/.claude
      - ${HOST_HOME:-.}/.claude.json:/host-config/.claude.json:ro
      - ${HOST_HOME:-.}/.codex:/home/dev/.codex
      - ${HOST_HOME:-.}/.codex.json:/home/dev/.codex.json
      - ${HOST_HOME:-.}/.config/git:/home/dev/.config/git:ro
    ports:
      - "${DEV_PORT:-50234}:${DEV_PORT:-50234}"
    networks:
      - devnet
    environment:
      - SENSIBO_API_KEY
      - PURPLEAIR_HOSTS
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - HOME=/home/dev
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - CODEX_HOME=/home/dev/.codex
      - TMPDIR=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - npm_config_cache=/tmp/.npm
      - PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
    stdin_open: true
    tty: true
    command: sleep infinity

networks:
  devnet:
    driver: bridge
