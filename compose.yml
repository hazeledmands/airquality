services:
  dev:
    build: .
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    tmpfs:
      - /tmp:exec
    volumes:
      - .:/app
      - ${HOST_HOME:-.}/.claude:/home/dev/.claude
      - ${HOST_HOME:-.}/.claude.json:/home/dev/.claude.json
      - ${HOST_HOME:-.}/.codex:/home/dev/.codex
      - ${HOST_HOME:-.}/.codex.json:/home/dev/.codex.json
      - ${HOST_HOME:-.}/.config/git:/home/dev/.config/git:ro
    network_mode: host
    environment:
      - SENSIBO_API_KEY
      - PURPLEAIR_HOSTS
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - HOME=/home/dev
      - CLAUDE_CONFIG_DIR=/home/dev/.claude
      - CODEX_HOME=/home/dev/.codex
      - TMPDIR=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - npm_config_cache=/tmp/.npm
    stdin_open: true
    tty: true
    command: sleep infinity
