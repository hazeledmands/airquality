name: Release

# Publishes ghcr.io/hazeledmands/airquality:<X.Y.Z> (plus <X.Y> and the short
# SHA) and tags the commit vX.Y.Z. The homelab's ImageUpdater promotes every
# release within its constraint (^1.0.0) to the cluster unattended, so the
# version number is the deployment contract:
#
#   MAJOR  the deployment changed: new required env var, infrastructure, or
#          proxy expectation, or a migration the previous build cannot
#          tolerate. The updater refuses to cross it; the homelab chart change
#          lands with a widened constraint.
#   MINOR  new capability, backward compatible.
#   PATCH  fix, backward compatible.
#
# Ordinary pushes to main (publish.yml) produce only `latest` and SHA tags,
# which are not semver and never auto-deploy.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example, 1.0.1)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must be dispatched from main.' >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must use the X.Y.Z format.' >&2
            exit 1
          fi

          file_version=$(tr -d '[:space:]' < VERSION)
          if [[ "$file_version" != "$VERSION" ]]; then
            echo "VERSION must declare $VERSION." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists and will not be moved." >&2
            exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "series=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Go binary embeds the built frontend, so it must exist before
      # go vet / go test can compile the main package.
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify application
        run: |
          go vet ./...
          go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ steps.version.outputs.series }}
            type=sha,prefix=,format=short

      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create annotated tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$TAG" --message "airquality $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --generate-notes --title "airquality $TAG"
