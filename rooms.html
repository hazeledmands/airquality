            text-decoration: none;

            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;

            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.04em;

            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            font-family: inherit;
        }

            outline: none;
            border-color: #38bdf8;
        }

        .date-range button {

            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #999;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;

        .room-section {
            margin-bottom: 2rem;
        }

            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #ffffff10;
        }
        .chart-card {
            background: #16172a;
            border: 1px solid #ffffff08;
            border-radius: 10px;
            padding: 1.25rem;
            overflow: hidden;
        }
        .room-latest {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            color: #bbb;
        }
        .room-latest .value { color: #e0e0e0; font-weight: 500; }
        .no-data {
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        #rooms-container:empty::after {
            content: 'Waiting for first sensor reading\2026';
            display: block;
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.2rem; }
            .header { flex-direction: column; gap: 0.2rem; margin-bottom: 1rem; }
            .status { font-size: 0.7rem; }
            .room-section h2 { font-size: 1rem; }
            .chart-card { padding: 1rem; }
            .date-range { gap: 0.4rem; }
            .date-range input[type="datetime-local"] { font-size: 0.75rem; padding: 0.3rem 0.4rem; }

        }

<body>
    <div class="header">

    <nav><a href="/">&larr; View by metric</a></nav>
    <div class="date-range">

</body>
