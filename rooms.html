            color: #e0e0e0;
            padding: 1.5rem;
        }
        h1 { font-size: 1.4rem; font-weight: 600; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.5rem;
        }
        .status { color: #666; font-size: 0.8rem; }
        nav { margin-bottom: 1rem; }

            color: #38bdf8;
            font-size: 0.8rem;
            text-decoration: none;
        }
        nav a:hover { text-decoration: underline; }
        .date-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

            background: #16172a;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            font-family: inherit;
        }
        .date-range input[type="datetime-local"]:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .date-range .sep { color: #555; font-size: 0.8rem; }
        .date-range button {
            background: #ffffff10;
            border: 1px solid #ffffff15;
            border-radius: 6px;
            color: #999;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }
        .date-range button:hover { background: #ffffff18; color: #ccc; }
        .date-range button.active { background: #38bdf820; border-color: #38bdf8; color: #38bdf8; }
        .room-section {
            margin-bottom: 2rem;
        }
        .room-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #ffffff10;
        }
        .chart-card {
            background: #16172a;
            border: 1px solid #ffffff08;
            border-radius: 10px;
            padding: 1.25rem;
            overflow: hidden;
        }
        .room-latest {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            color: #bbb;
        }
        .room-latest .value { color: #e0e0e0; font-weight: 500; }
        .no-data {
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        #rooms-container:empty::after {
            content: 'Waiting for first sensor reading\2026';
            display: block;
            color: #444;
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.2rem; }
            .header { flex-direction: column; gap: 0.2rem; margin-bottom: 1rem; }
            .status { font-size: 0.7rem; }
            .room-section h2 { font-size: 1rem; }
            .chart-card { padding: 1rem; }
            .date-range { gap: 0.4rem; }
            .date-range input[type="datetime-local"] { font-size: 0.75rem; padding: 0.3rem 0.4rem; }
            .date-range label { font-size: 0.65rem; }
            .room-latest { font-size: 0.75rem; gap: 1rem; }
        }

<body>
    <div class="header">
        <h1>Air Quality &mdash; By Room</h1>
        <span class="status" id="status">Loading&hellip;</span>
    </div>
    <nav><a href="/by-metric">View by metric &rarr;</a></nav>
    <div class="date-range">
        <button id="rangePrev" title="Previous">&#9664;</button>
        <button class="preset-btn" data-ms="3600000">1h</button>
        <button class="preset-btn" data-ms="28800000">8h</button>
        <button class="preset-btn" data-ms="86400000">1d</button>
        <button class="preset-btn" data-ms="259200000">3d</button>
        <button class="preset-btn" data-ms="604800000">1w</button>
        <button id="rangeNext" title="Next">&#9654;</button>
        <label for="rangeFrom">From</label>
        <input type="datetime-local" id="rangeFrom">
        <span class="sep">&ndash;</span>
        <label for="rangeTo">To</label>
        <input type="datetime-local" id="rangeTo">
        <button id="rangeReset">Reset</button>
    </div>
    <div id="rooms-container"></div>
</body>
</html>
